<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de vida · la IA jugando</title>
<style>
  /* Mismo sistema que el panel del entrenamiento: añil de noche, datos en naranja de amanecer, sin animaciones. */
  :root {
    color-scheme: dark;
    --pagina: #1d1c30; --superficie: #25233a; --superficie-2: #2f2d48;
    --tinta: #f4f2ff; --tinta-2: #cbc7e3; --tinta-3: #9d98bd;
    --rejilla: #35334f; --borde: rgba(203,199,227,.12);
    --serie-1: #e0702f; --serie-2: #9085e9; --bien: #0ca30c; --critico: #d03b3b; --foco: #ffb347;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pagina); color: var(--tinta); font: 15px/1.5 system-ui, "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  ::selection { background: var(--foco); color: #1d1c30; }
  :focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  main { padding: 20px clamp(16px, 2vw, 28px); display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .arriba { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .frase { font-size: 1.75rem; font-weight: 600; line-height: 1.2; margin: 0; }
  .detalle { color: var(--tinta-2); margin: 4px 0 0; }
  a { color: var(--tinta-2); }
  .panel { background: var(--superficie); border: 1px solid var(--borde); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  .fichas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; }
  .ficha { padding: 4px 14px 10px 0; }
  .ficha .et { color: var(--tinta-2); font-size: 13px; }
  .ficha .v { font-size: 1.375rem; font-weight: 600; }
  .ficha .nota { color: var(--tinta-3); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 5px 6px; border-bottom: 1px solid var(--rejilla); text-align: left; }
  th { color: var(--tinta-2); font-weight: 500; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .separador { margin: 14px 0 2px; color: var(--tinta-2); font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--eje, #47446a); padding-bottom: 4px; }
  .paso { border-top: 1px solid var(--rejilla); padding: 12px 0; display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
  .paso:first-of-type { border-top: 0; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--superficie-2); color: var(--tinta-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .paso.ultimo .num { background: var(--serie-1); color: #1d1c30; }
  .piensa { margin: 0 0 6px; }
  .accion { color: var(--tinta-2); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--superficie-2); color: var(--tinta-2); }
  .chip.mal { background: rgba(208,59,59,.2); color: #ffb3b3; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--tinta-3); font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 Consolas, monospace; color: var(--tinta-2); background: var(--pagina);
        border-radius: 6px; padding: 8px 10px; margin: 6px 0 0; max-height: 260px; overflow: auto; }
  .vacio { color: var(--tinta-3); }
  .lado { display: grid; gap: 16px; align-content: start; }
  .punto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
</style>
</head>
<body>
<main>
  <div class="arriba">
    <div>
      <p class="frase" id="frase">Esperando a que empiece la partida…</p>
      <p class="detalle" id="detalle">Cuando la IA empiece a jugar aparecerá aquí, paso a paso. <a href="/">Volver al panel del entrenamiento</a></p>
    </div>
  </div>

  <section class="panel">
    <h2>Lo que piensa y hace, paso a paso</h2>
    <div id="pasos"><p class="vacio">Todavía no ha dado ningún paso.</p></div>
  </section>

  <div class="lado">
    <section class="panel">
      <h2>Su dinero ahora</h2>
      <div class="fichas">
        <div class="ficha"><div class="et">Patrimonio</div><div class="v" id="patrimonio">–</div><div class="nota" id="capital"></div></div>
        <div class="ficha"><div class="et">Efectivo</div><div class="v" id="efectivo">–</div></div>
      </div>
      <table id="posiciones"></table>
    </section>
    <section class="panel" id="caja-comparacion" hidden>
      <h2>Comparación con el bot profesor (misma fecha, mismo dinero)</h2>
      <table id="comparacion"></table>
      <p class="detalle" id="profesor-dijo" style="font-size:13px"></p>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const eur = x => x == null ? "–" : Number(x).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const args = c => { const a = c.function.arguments; try { return typeof a === "string" ? JSON.parse(a) : a; } catch { return { command: a }; } };

function describe(c) {
  const n = c.function.name, a = args(c);
  if (n === "end_session") return `Se va a dormir ${Math.round((a.wake_in_minutes || 0) / 60)} h`;
  const cmd = a.command || "";
  const partes = [];
  if (cmd.includes("SERVICIOS.md")) partes.push("lee cómo funcionan los servicios");
  if (/v2\/clock/.test(cmd)) partes.push("mira si la bolsa está abierta");
  if (/v2\/account/.test(cmd)) partes.push("mira su dinero");
  if (/v2\/positions/.test(cmd)) partes.push("mira su cartera");
  if (/v2\/orders/.test(cmd)) partes.push(`manda ${(cmd.match(/v2\/orders/g) || []).length} orden(es) al bróker`);
  if (/ranking\.py/.test(cmd)) partes.push("ejecuta su programa de ranking");
  if (/NOTES\.md/.test(cmd)) partes.push("escribe sus notas");
  return partes.length ? partes.join(", ") : "ejecuta un comando";
}

function pinta(v) {
  if (!v.modelo) return;
  const fases = { pensando: "La IA está pensando…", durmiendo: "La IA ha terminado la sesión y se ha ido a dormir.",
                  terminado: "Partida terminada.", "sin terminar": "La sesión se ha quedado sin pasos." };
  $("frase").textContent = fases[v.fase] || v.fase;
  $("detalle").innerHTML = `Día simulado: <b>${esc(v.fecha_simulada || v.inicio)}</b>. ` +
    (v.sesiones === "vida" ? `Sesión ${v.sesion} de una vida del ${esc(v.inicio)} al ${esc(v.fin)}. ` : `Sesión ${v.sesion} de ${v.sesiones}. `) +
    `Empezó con ${eur(v.capital)}. IA: ${esc(v.modelo)}. <a href="/">Volver al panel</a>`;
  const c = v.cartera || {};
  $("patrimonio").textContent = eur(c.patrimonio);
  const dif = c.patrimonio != null ? c.patrimonio - v.capital : null;
  $("capital").textContent = dif != null ? `${dif >= 0 ? "+" : ""}${eur(dif)} desde el inicio` : "";
  $("efectivo").textContent = eur(c.efectivo);
  const pos = Object.entries(c.posiciones_ || c["posiciones_€"] || {});
  $("posiciones").innerHTML = pos.length ? "<tr><th>Tiene</th><th style='text-align:right'>Vale</th></tr>" +
    pos.map(([k, x]) => `<tr><td>${esc(k)}${k === c.fondo_indice ? " <span class='chip'>fondo del índice</span>" : ""}</td><td class="n">${eur(x)}</td></tr>`).join("")
    : "<tr><td class='vacio'>Todavía no ha comprado nada.</td></tr>";

  const pasos = v.pasos || [];
  let ses = null;
  $("pasos").innerHTML = pasos.length ? pasos.map((p, i) => {
    const cab = p.sesion !== ses ? `<div class="separador">Sesión ${p.sesion} · ${esc(p.fecha || "")}</div>` : "";
    ses = p.sesion;
    const llamadas = p.llamadas || [], salidas = p.salidas || [];
    return cab + `<div class="paso${i === pasos.length - 1 ? " ultimo" : ""}"><span class="num">${i + 1}</span><div>
      <p class="piensa">${esc(p.piensa || "(no escribe nada, solo actúa)")}</p>
      <div class="accion">${llamadas.map(c => `<span class="chip">${esc(describe(c))}</span>`).join("") || "<span class='chip mal'>no usó ninguna herramienta</span>"}
        <span>${p.uso ? `${p.uso.completion_tokens || 0} tokens en ${Number(p.uso.segundos).toFixed(1)} s` : ""}</span></div>
      ${llamadas.map(c => `<details><summary>Ver la orden exacta</summary><pre>${esc(args(c).command || JSON.stringify(args(c), null, 1))}</pre></details>`).join("")}
      ${salidas.map(s => `<details><summary>Ver lo que le respondió el sistema</summary><pre>${esc(s)}</pre></details>`).join("")}
    </div></div>`; }).join("") : "<p class='vacio'>Todavía no ha dado ningún paso.</p>";

  if (v.comparacion) {
    const k = v.comparacion, pc = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1).replace(".", ",") + " %";
    $("caja-comparacion").hidden = false;
    $("comparacion").innerHTML = "<tr><th></th><th style='text-align:right'>Acaba con</th><th style='text-align:right'>Gana / pierde</th><th style='text-align:right'>Errores</th></tr>" +
      `<tr><td><span class='punto' style='background:var(--serie-1)'></span>IA</td><td class="n">${eur(k.ia.final)}</td><td class="n">${pc(k.ia.rend)}</td><td class="n">${k.ia.errores}</td></tr>` +
      `<tr><td><span class='punto' style='background:var(--serie-2)'></span>Bot profesor</td><td class="n">${eur(k.profesor.final)}</td><td class="n">${pc(k.profesor.rend)}</td><td class="n">${k.profesor.errores}</td></tr>` +
      (k.profesor_frecuente ? `<tr><td><span class='punto' style='background:var(--tinta-3)'></span>Bot profesor revisando igual que la IA</td><td class="n">${eur(k.profesor_frecuente.final)}</td><td class="n">${pc(k.profesor_frecuente.rend)}</td><td class="n">${k.profesor_frecuente.errores}</td></tr>` : "") +
      `<tr><td>Índice (S&P 500)</td><td class="n">–</td><td class="n">${pc(k.indice)}</td><td class="n">–</td></tr>`;
    $("profesor-dijo").textContent = `Vida del ${k.inicio} al ${k.fin}, empezando con ${eur(k.capital)}. La IA escribió a ${String(k.ia.tokens_s).replace(".", ",")} tokens/s` +
      (k.factor_sueno && k.factor_sueno !== 1 ? ` y dormía ${Math.round(1 / k.factor_sueno)} veces menos de lo que pedía (${k.ia.sesiones} sesiones).` : ".");
  } else if (v.profesor) {
    const pr = v.profesor.resultado || {}, ia = c;
    $("caja-comparacion").hidden = false;
    const fila = (k, a, b) => `<tr><td>${k}</td><td class="n">${a}</td><td class="n">${b}</td></tr>`;
    $("comparacion").innerHTML = "<tr><th></th><th style='text-align:right'><span class='punto' style='background:var(--serie-1)'></span>IA</th><th style='text-align:right'><span class='punto' style='background:var(--serie-2)'></span>Profesor</th></tr>" +
      fila("Patrimonio", eur(ia.patrimonio), eur(pr.patrimonio)) +
      fila("Efectivo", eur(ia.efectivo), eur(pr.efectivo)) +
      fila("Posiciones", Object.keys(ia["posiciones_€"] || {}).length, Object.keys(pr["posiciones_€"] || {}).length) +
      fila("Errores", (v.errores || []).length, v.profesor.errores ?? "–");
    $("profesor-dijo").textContent = (v.profesor.hecho || []).length ? "El profesor hizo: " + v.profesor.hecho.join("; ") + "." : "";
  }
}

async function actualiza() {
  try { pinta(await (await fetch("/vida.json", { cache: "no-store" })).json()); } catch {}
}
actualiza(); setInterval(actualiza, 2000);
</script>
</body>
</html>
